name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 跑自测（含违规注入反证）
        run: python3 -m gate_runner.cli selftest
      - name: 跑单元测试
        run: python3 -m unittest discover -s tests
